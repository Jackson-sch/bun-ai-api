<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bun AI API Tester</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Bun AI API</h1>
            </div>

            <nav class="nav-tabs">
                <button id="show-chat" class="tab-btn active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Chat
                </button>
                <button id="show-rest" class="tab-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    REST Console
                </button>
            </nav>

            <div class="sidebar-scrollable">
                <section class="sidebar-section">
                    <h3>AI Services</h3>
                    <ul id="services-container">
                        <!-- Services injected here -->
                    </ul>
                </section>

                <section class="sidebar-section">
                    <h3>Conversations</h3>
                    <ul id="conversations-container">
                        <!-- Conversations injected here -->
                    </ul>
                </section>
            </div>

            <footer class="sidebar-footer">
                <button id="new-chat-btn" class="btn-primary-small">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
                <button id="clear-chat" class="btn-ghost">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                    Clear History
                </button>
            </footer>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-info">
                    <h2 id="current-service">All Services (Round Robin)</h2>
                    <p>Powered by Bun & PostgreSQL</p>
                </div>
                <div class="header-actions">
                    <div class="layout-controls">
                        <button id="toggle-layout" class="btn-icon" title="Toggle Split View">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                        </button>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle" checked title="Round Robin Switch">
                        <span class="slider"></span>
                    </label>
                </div>
            </header>

            <div id="workspace-container" class="workspace-container">
                <!-- Chat View -->
                <div id="messages-view" class="view-panel">
                <div id="messages" class="messages-list">
                    <div class="message system">
                        <div class="message-content">Bun AI API is online. Ready to chat.</div>
                    </div>
                </div>
                
                <div class="input-area">
                    <p id="request-metadata" class="metadata-bar"></p>
                    <form id="chat-form" class="input-box">
                        <textarea id="user-input" placeholder="Ask anything... (Shift+Enter for newline)"></textarea>
                        <button type="submit" id="send-btn" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- REST Console View -->
            <div id="rest-console" class="view-container hidden">
                <div class="rest-workspace">
                    <div class="rest-card request-builder">
                        <div class="control-group">
                            <select id="rest-method" class="rest-select">
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                                <option value="DELETE">DELETE</option>
                            </select>
                            <input type="text" id="rest-url" class="rest-input" value="/api/conversations" placeholder="/api/endpoint">
                            <button id="rest-send" class="btn-accent">Execute</button>
                        </div>
                        
                        <div class="editor-section">
                            <label>Request Body (JSON)</label>
                            <textarea id="rest-body" class="rest-editor" placeholder='{ "title": "My Topic" }'></textarea>
                        </div>
                    </div>

                    <div class="rest-card response-viewer">
                        <label>Response Body</label>
                        <pre id="rest-response" class="code-block">// Execute a request to see results</pre>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Modal -->
    <dialog id="custom-modal" class="modal-dialog">
        <div class="modal-content-inner">
            <h3 id="modal-title">Confirmación</h3>
            <p id="modal-message">¿Estás seguro de realizar esta acción?</p>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn-secondary">Cancelar</button>
                <button id="modal-confirm" class="btn-danger">Confirmar</button>
            </div>
        </div>
    </dialog>

    <script src="index.js"></script>
</body>
</html>
